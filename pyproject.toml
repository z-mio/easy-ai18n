[project]
name = "easy-ai18n"
version = "1.1.3"
description = "Simple and Elegant Python3 Internationalization (i18n) Tool"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "梓澪", email = "zilingmio@gmail.com" }
]
dependencies = [
      "googletrans>=4.0.2",
      "instructor>=1.15.1",
      "loguru>=0.7.3",
      "python-dotenv>=1.2.2",
      "pyyaml>=6.0.3",
      "tenacity>=9.1.4",
      "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.4.2",
    "mypy>=2.1.0",
]

[project.urls]
Repository = "https://github.com/z-mio/easy-ai18n"
Issues = "https://github.com/z-mio/easy-ai18n/issues"

[tool.ruff]
line-length = 120
exclude = [
    "tests",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle 错误检查
    "W", # pycodestyle 警告检查
    "F", # pyflakes 错误检查
    "I", # isort 导入排序
    "B", # flake8-bugbear 常见错误检查
    "C4", # flake8-comprehensions 列表/字典推导式检查
    "UP", # pyupgrade 自动升级语法
]
ignore = [
    "B008", # 不在参数默认值中执行函数调用
    "C901", # 函数复杂度过高
]

[tool.pytest.ini_options]
testpaths =  ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src/easy_ai18n"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = false
